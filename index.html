<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inverted Hand Square Effect</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d12;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .stage {
      position: relative;
      width: min(92vw, 900px);
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    video { display: none; }
    .hud {
      margin-top: 14px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background: #7c3aed;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    button:disabled { background: #3f3f46; cursor: not-allowed; }
    .status {
      font-size: 13px;
      color: #e4e4e7;
      background: rgba(255,255,255,0.08);
      padding: 6px 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="stage">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>
  </div>

  <div class="hud">
    <button id="startBtn">Start Camera</button>
    <button id="modeBtn" disabled>Tint: Neon Purple/Green</button>
    <div class="status" id="status">Step 1: Click "Start Camera"</div>
  </div>

  <script type="module">
    const statusEl = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");
    const modeBtn = document.getElementById("modeBtn");
    const video = document.getElementById("webcam");
    const canvas = document.getElementById("output");
    const ctx = canvas.getContext("2d");

    const fxCanvas = document.createElement("canvas");
    const fxCtx = fxCanvas.getContext("2d");

    let handLandmarker = null;
    let running = false;
    let lastVideoTime = -1;
    let colorMode = 0;

    const MODES = [
      { name: "Neon Purple/Green", filter: "invert(1) hue-rotate(115deg) saturate(380%) contrast(165%)" },
      { name: "Classic Negative", filter: "invert(1) contrast(130%)" },
      { name: "Cyber Thermal", filter: "invert(1) hue-rotate(240deg) saturate(450%) contrast(180%)" }
    ];

    modeBtn.addEventListener("click", () => {
      colorMode = (colorMode + 1) % MODES.length;
      modeBtn.textContent = "Tint: " + MODES[colorMode].name;
    });

    const AT = String.fromCharCode(64);
    const PKG_BASE = "https://jsdelivr.net" + AT + "mediapipe/tasks-vision" + AT + "0.10.14";
    const MODULE_URL = PKG_BASE + "/vision_bundle.mjs";
    const WASM_URL = PKG_BASE + "/wasm";

    // Try local repo file first, then official Google mirror, then GitHub jsDelivr mirror
    const MODEL_MIRRORS = [
      "./hand_landmarker.task",
      "https://googleapis.com",
      "https://jsdelivr.net" + AT + "main/examples/hand_landmarker/raspberry_pi/hand_landmarker.task"
    ];

    async function fetchModelBuffer() {
      for (const url of MODEL_MIRRORS) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            const buf = await res.arrayBuffer();
            if (buf.byteLength > 100000) return new Uint8Array(buf);
          }
        } catch (e) {
          // Try next mirror
        }
      }
      throw new Error("Could not download hand_landmarker.task from any mirror.");
    }

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;

      try {
        statusEl.textContent = "Step 2: Opening webcam...";
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        canvas.width = fxCanvas.width = video.videoWidth || 640;
        canvas.height = fxCanvas.height = video.videoHeight || 480;

        running = true;
        requestAnimationFrame(renderLoop);

        statusEl.textContent = "Step 3: Downloading vision_bundle.mjs...";
        const { HandLandmarker, FilesetResolver } = await import(MODULE_URL);

        statusEl.textContent = "Step 4: Loading WASM engine...";
        const vision = await FilesetResolver.forVisionTasks(WASM_URL);

        statusEl.textContent = "Step 5: Fetching hand_landmarker.task...";
        const modelBuffer = await fetchModelBuffer();

        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetBuffer: modelBuffer,
            delegate: "CPU"
          },
          runningMode: "VIDEO",
          numHands: 2,
          minHandDetectionConfidence: 0.45,
          minHandPresenceConfidence: 0.45,
          minTrackingConfidence: 0.45
        });

        modeBtn.disabled = false;
        statusEl.textContent = "READY! Hold up both thumbs & index fingers.";
      } catch (err) {
        console.error(err);
        statusEl.textContent = "ERROR: " + (err.message || err);
        startBtn.disabled = false;
      }
    });

    function renderLoop() {
      if (!running) return;

      const w = canvas.width;
      const h = canvas.height;

      ctx.save();
      ctx.translate(w, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, w, h);
      ctx.restore();

      if (handLandmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = handLandmarker.detectForVideo(video, performance.now());

        if (results.landmarks && results.landmarks.length >= 2) {
          const hands = results.landmarks.map((lm) => {
            const thumbTip = lm.at(4);
            const indexTip = lm.at(8);
            const thumb = { x: (1 - thumbTip.x) * w, y: thumbTip.y * h };
            const index = { x: (1 - indexTip.x) * w, y: indexTip.y * h };
            return { thumb, index, centerX: (thumb.x + index.x) * 0.5 };
          }).sort((a, b) => a.centerX - b.centerX);

          const leftHand = hands.at(0);
          const rightHand = hands.at(1);

          const pts = [
            leftHand.index,
            rightHand.index,
            rightHand.thumb,
            leftHand.thumb
          ];

          fxCtx.save();
          fxCtx.filter = MODES[colorMode].filter;
          fxCtx.translate(w, 0);
          fxCtx.scale(-1, 1);
          fxCtx.drawImage(video, 0, 0, w, h);
          fxCtx.restore();

          ctx.save();
          ctx.beginPath();
          ctx.moveTo(pts.at(0).x, pts.at(0).y);
          ctx.lineTo(pts.at(1).x, pts.at(1).y);
          ctx.lineTo(pts.at(2).x, pts.at(2).y);
          ctx.lineTo(pts.at(3).x, pts.at(3).y);
          ctx.closePath();

          ctx.save();
          ctx.clip();
          ctx.drawImage(fxCanvas, 0, 0, w, h);
          ctx.restore();

          ctx.lineWidth = 3;
          ctx.strokeStyle = "rgba(255, 255, 255, 0.92)";
          ctx.shadowColor = "#a855f7";
          ctx.shadowBlur = 12;
          ctx.stroke();
          ctx.restore();
        }
      }

      requestAnimationFrame(renderLoop);
    }
  </script>
</body>
</html>
